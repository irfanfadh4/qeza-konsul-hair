<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konsultasi Hair Booster Therapy — Qeza</title>
<style>
  :root{
    --orange:#fa6400;
    --orange-dark:#c94f00;
    --cream:#FEF3E2;
    --gold:#FAB12F;
    --ink:#2b1d12;
    --ink-soft:#6b5a48;
    --line:#ecdcc4;
    --white:#fffdf9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Georgia','Iowan Old Style',serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.5;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:32px 20px 80px;
  }
  header{
    text-align:left;
    margin-bottom:28px;
    border-bottom:2px solid var(--orange);
    padding-bottom:18px;
  }
  header .kicker{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:13px;
    color:var(--orange-dark);
    letter-spacing:0.02em;
    margin-bottom:6px;
  }
  header h1{
    font-size:26px;
    margin:0 0 8px;
    line-height:1.25;
  }
  header p{
    font-family:'Helvetica Neue',Arial,sans-serif;
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0;
  }
  .promo-box{
    background:linear-gradient(135deg,var(--gold) 0%, var(--orange) 100%);
    color:var(--white);
    border-radius:10px;
    padding:14px 18px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:14px;
    margin-bottom:28px;
  }
  .promo-box b{display:block;font-size:15px;margin-bottom:3px;}

  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px 22px 20px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--orange-dark);
    margin:0 0 4px;
  }
  .card .q{
    font-size:17px;
    margin:0 0 14px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 14px;
    cursor:pointer;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:14.5px;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--orange);}
  .opt.selected{
    border-color:var(--orange);
    background:#fff6ec;
  }
  .opt input{accent-color:var(--orange);}
  textarea{
    width:100%;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:14.5px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 14px;
    resize:vertical;
    min-height:70px;
  }
  .btn{
    display:block;
    width:100%;
    background:var(--orange);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:15px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:15.5px;
    font-weight:600;
    cursor:pointer;
    margin-top:8px;
  }
  .btn:disabled{background:#e0c9ab;cursor:not-allowed;}
  .btn:hover:not(:disabled){background:var(--orange-dark);}

  .result{
    background:var(--white);
    border:1px solid var(--line);
    border-left:4px solid var(--orange);
    border-radius:10px;
    padding:22px;
    margin-top:8px;
    font-size:15.5px;
  }
  .result h3{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--orange-dark);
    margin:0 0 12px;
  }
  .result p{margin:0 0 12px;}
  .result p:last-child{margin-bottom:0;}
  .loading{
    text-align:center;
    padding:30px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    color:var(--ink-soft);
    font-size:14px;
  }
  .wa-btn{
    display:block;
    text-align:center;
    background:#25D366;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    padding:15px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-weight:600;
    font-size:15.5px;
    margin-top:16px;
  }
  .wa-btn:hover{background:#1ebc59;}
  .hidden{display:none;}
  .progress{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .error{
    color:#b91c1c;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:14px;
    text-align:center;
    padding:20px;
  }
  .validation-msg{
    color:#b91c1c;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:13px;
    margin-top:8px;
  }
  .char-count{
    text-align:right;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:4px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">QEZA AESTHETIC CLINIC</div>
    <h1>Konsultasi Hair Booster Therapy + PDT</h1>
    <p>Jawab beberapa pertanyaan singkat, dan dapatkan penjelasan personal tentang treatment ini — cocok atau tidaknya tetap perlu dikonfirmasi lewat hair analysis di klinik.</p>
  </header>

  <div id="formArea"></div>

  <div id="loadingArea" class="loading hidden">Sedang menyiapkan penjelasan untuk kamu...</div>

  <div id="resultArea" class="hidden"></div>

</div>

<script>
// -----------------------------------------------------------------
// PENTING: nomor WhatsApp CS Qeza
// -----------------------------------------------------------------
const WA_NUMBER = "6282327610034";

// -----------------------------------------------------------------
// Promo yang tampil di layar HARUS SAMA dengan PROMO_TEXT di
// api/consult.js — supaya angka yang ditulis di layar dan yang
// disebut AI dalam penjelasannya konsisten. Edit di DUA tempat ini
// setiap ada perubahan promo.
// -----------------------------------------------------------------
const PROMO_DISPLAY_TEXT = "Harga normal Hair Booster Therapy + PDT: Rp 775.000. Khusus untuk kamu yang baru konsultasi hari ini, harganya jadi Rp 619.000.";

let answers = {
  durasi: null,
  keluhan: null,
  riwayat: null,
  keraguan: [],
  waktu: null,
  pertanyaanBebas: ""
};

const steps = [
  {
    key: "durasi",
    title: "Bagian 1 dari 3",
    q: "Sudah berapa lama kamu mengalami masalah rambut ini?",
    type: "single",
    options: ["Baru mulai terasa (kurang dari 1 bulan)", "Beberapa bulan terakhir", "Lebih dari setahun"]
  },
  {
    key: "keluhan",
    title: "Bagian 1 dari 3",
    q: "Apa yang paling kamu khawatirkan soal rambutmu?",
    type: "single",
    options: ["Rambut rontok", "Rambut tipis dan lemas", "Kulit kepala terasa tidak sehat (gatal/berminyak/kering)", "Kombinasi beberapa hal di atas"]
  },
  {
    key: "riwayat",
    title: "Bagian 1 dari 3",
    q: "Apakah kamu pernah coba treatment rambut sebelumnya?",
    type: "single",
    options: ["Belum pernah sama sekali", "Pernah, tapi hasilnya kurang memuaskan", "Pernah, dan cukup membantu"]
  },
  {
    key: "keraguan",
    title: "Bagian 2 dari 3",
    q: "Apa yang bikin kamu masih ragu untuk mencoba treatment ini? (boleh pilih lebih dari satu)",
    type: "multi",
    options: ["Takut sakit/nyeri saat treatment", "Takut hasilnya tidak sesuai ekspektasi", "Belum tahu prosesnya seperti apa", "Masalah harga/budget", "Belum yakin ini cocok untuk kondisi rambutku"]
  },
  {
    key: "waktu",
    title: "Bagian 3 dari 3",
    q: "Kamu berencana treatment ini untuk kapan?",
    type: "single",
    options: ["Secepatnya, minggu ini", "Dalam bulan ini", "Masih cari informasi dulu"]
  },
  {
    key: "pertanyaanBebas",
    title: "Bagian 3 dari 3",
    q: "Ada pertanyaan spesifik lain yang mau kamu tanyakan? (opsional)",
    type: "text"
  }
];

let currentStep = 0;

function renderStep(){
  const area = document.getElementById('formArea');
  const step = steps[currentStep];
  let html = `<div class="card">
    <div class="progress">${step.title}</div>
    <h2>Pertanyaan ${currentStep+1} / ${steps.length}</h2>
    <p class="q">${step.q}</p>`;

  if(step.type === "single"){
    html += '<div class="options">';
    step.options.forEach((opt)=>{
      const selected = answers[step.key] === opt ? 'selected' : '';
      html += `<label class="opt ${selected}" data-key="${step.key}" data-value="${escapeHtml(opt)}" data-type="single">
        <input type="radio" name="${step.key}" ${answers[step.key]===opt?'checked':''}/> ${opt}
      </label>`;
    });
    html += '</div>';
  } else if(step.type === "multi"){
    html += '<div class="options">';
    step.options.forEach((opt)=>{
      const selected = answers[step.key].includes(opt) ? 'selected' : '';
      html += `<label class="opt ${selected}" data-key="${step.key}" data-value="${escapeHtml(opt)}" data-type="multi">
        <input type="checkbox" ${answers[step.key].includes(opt)?'checked':''}/> ${opt}
      </label>`;
    });
    html += '</div>';
  } else if(step.type === "text"){
    html += `<textarea id="freeText" maxlength="300" placeholder="Tulis di sini (boleh dikosongkan, maksimal 300 karakter)...">${answers[step.key]||""}</textarea>
    <div class="char-count" id="charCount">${(answers[step.key]||"").length}/300</div>`;
  }

  const isLast = currentStep === steps.length - 1;
  const isAnswered = step.type === 'text' ? true : (step.type === 'multi' ? answers[step.key].length > 0 : !!answers[step.key]);
  html += `<div class="validation-msg hidden" id="validationMsg">Mohon pilih salah satu jawaban dulu ya.</div>`;
  html += `<button class="btn" id="nextBtn">${isLast ? "Lihat penjelasan dari kami" : "Lanjut"}</button>`;
  html += `</div>`;

  area.innerHTML = html;

  if(step.type === 'text'){
    const textarea = document.getElementById('freeText');
    const counter = document.getElementById('charCount');
    textarea.addEventListener('input', ()=>{
      counter.textContent = `${textarea.value.length}/300`;
    });
  }

  area.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.key;
      const value = el.dataset.value;
      const type = el.dataset.type;
      if(type === 'single'){
        answers[key] = value;
      } else {
        const idx = answers[key].indexOf(value);
        if(idx > -1){ answers[key].splice(idx,1); } else { answers[key].push(value); }
      }
      renderStep();
    });
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(step.type === 'text'){
      answers.pertanyaanBebas = document.getElementById('freeText').value.slice(0,300);
    } else {
      const answered = step.type === 'multi' ? answers[step.key].length > 0 : !!answers[step.key];
      if(!answered){
        document.getElementById('validationMsg').classList.remove('hidden');
        return;
      }
    }
    if(isLast){
      submitConsultation();
    } else {
      currentStep++;
      renderStep();
    }
  });
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function submitConsultation(){
  document.getElementById('formArea').classList.add('hidden');
  document.getElementById('loadingArea').classList.remove('hidden');

  try{
    // Panggil backend sendiri (Vercel serverless function), BUKAN Anthropic langsung.
    // API key tersimpan aman di server, tidak pernah terkirim ke browser.
    const response = await fetch('/api/consult', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(answers)
    });

    if(!response.ok){
      throw new Error('Request failed');
    }

    const data = await response.json();
    showResult(data.result || 'Maaf, terjadi kendala. Silakan hubungi CS kami langsung ya.');
  } catch(err){
    showResult("Maaf, terjadi kendala teknis saat menyiapkan penjelasan. Silakan hubungi CS kami langsung untuk konsultasi ya.", true);
  }
}

function buildWaMessage(aiResult, isFallback){
  const lines = [];
  lines.push("Halo Qeza, saya baru selesai konsultasi AI untuk Hair Booster Therapy + PDT.");
  lines.push("");
  lines.push("Ringkasan jawaban saya:");
  lines.push(`- Lama masalah rambut: ${answers.durasi}`);
  lines.push(`- Keluhan utama: ${answers.keluhan}`);
  lines.push(`- Riwayat treatment: ${answers.riwayat}`);
  lines.push(`- Hal yang bikin ragu: ${answers.keraguan.length ? answers.keraguan.join(", ") : "Tidak ada"}`);
  lines.push(`- Rencana waktu treatment: ${answers.waktu}`);
  if(answers.pertanyaanBebas){
    lines.push(`- Pertanyaan tambahan: ${answers.pertanyaanBebas}`);
  }
  lines.push("");
  if(isFallback){
    lines.push("(Penjelasan AI belum sempat tampil karena kendala teknis, mohon dibantu CS ya.)");
  } else {
    lines.push("Penjelasan dari AI:");
    lines.push(aiResult);
  }
  lines.push("");
  lines.push("Saya ingin lanjut konsultasi/booking.");
  return lines.join("\n");
}

function showResult(text, isFallback){
  document.getElementById('loadingArea').classList.add('hidden');
  const resultArea = document.getElementById('resultArea');
  const paragraphs = text.split(/\n\n+/).map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`).join('');

  let waMessage = buildWaMessage(text, isFallback);
  // Jaga-jaga kalau pesan kepanjangan untuk URL wa.me, potong bagian penjelasan AI
  // supaya link tetap valid, sisanya tetap bisa dibaca CS di chat.
  if(waMessage.length > 1800){
    const trimmedResult = text.slice(0, 500) + "... (lanjutan ada di layar konsultasi pasien)";
    waMessage = buildWaMessage(trimmedResult, isFallback);
  }

  resultArea.innerHTML = `
    <div class="result">
      <h3>Penjelasan untuk kamu</h3>
      ${paragraphs}
    </div>
    <a class="wa-btn" href="https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(waMessage)}" target="_blank" rel="noopener">
      Lanjut konsultasi via WhatsApp
    </a>
    <div class="promo-box" id="promoBox">
      <b>Promo khusus buat kamu</b>
      ${PROMO_DISPLAY_TEXT}
    </div>
  `;
  resultArea.classList.remove('hidden');
}

renderStep();
</script>

</body>
</html>
